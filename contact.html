<main>
  <h2>Get in Touch</h2>

<form class="contact-form" action="#" method="post" onsubmit="sendMessages(); return false;">

  <label for="name">Name</label>
  <input type="text" id="name" name="name" placeholder="Your name" required>

  <label for="email">Email</label>
  <input type="email" id="email" name="email" placeholder="Your email" required>

  <label for="phone">Phone</label>
  <input type="tel" id="phone" name="phone" placeholder="Your phone number">

  <label for="message">Message</label>
  <textarea id="message" name="message" rows="5" placeholder="Your message" required></textarea>

  <button type="submit">Send Message</button>
  <p id="confirmation"></p>

</form>

  <h3>Contact Info</h3>
  <p>Email: bridgeto@opportunity.com</p>
  <p>Phone: 888-555-5555
  </p>
  <p>Address: 12345 Phoenix Lane, Costa Mesa, AZ</p>
</main>
<script>
function sendMessage() {
  document.getElementById("confirmation").innerText =
    "Your message has been sent! You will hear from an expert soon.";
}
</script>
